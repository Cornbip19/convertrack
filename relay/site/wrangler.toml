# convertrack.io — the public homepage and privacy policy that Google's OAuth
# app verification requires. Static files only; no Worker script, so requests
# are free and unlimited on Cloudflare's Workers Free plan.
#
# Deploy from this folder (Wrangler resolves from ../node_modules):
#   npx wrangler deploy
# The custom domains below need the convertrack.io zone in the same Cloudflare
# account; Cloudflare creates the DNS records and the certificate itself.

name = "convertrack-site"
compatibility_date = "2025-09-01"
workers_dev = false

[assets]
directory = "./public"
# "/privacy" serves public/privacy.html (default html_handling, auto-trailing-slash);
# unknown paths get public/404.html with a 404 status.
not_found_handling = "404-page"

[[routes]]
pattern = "convertrack.io"
custom_domain = true

[[routes]]
pattern = "www.convertrack.io"
custom_domain = true
